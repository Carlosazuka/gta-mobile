<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>City Rush 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial}
canvas{display:block;width:100%;height:100%}

#ui{
 position:fixed;inset:0;pointer-events:none;
}
#stats{
 position:absolute;top:12px;left:12px;
 color:white;background:rgba(0,0,0,.55);
 padding:9px 12px;border-radius:10px;
 font-size:14px;
}
#mission{
 position:absolute;top:12px;left:50%;
 transform:translateX(-50%);
 color:white;background:rgba(0,0,0,.55);
 padding:9px 15px;border-radius:10px;
}
#joystick{
 position:absolute;left:25px;bottom:25px;
 width:125px;height:125px;border-radius:50%;
 background:rgba(255,255,255,.15);
 border:2px solid rgba(255,255,255,.3);
 pointer-events:auto;
}
#stick{
 position:absolute;left:37px;top:37px;
 width:47px;height:47px;border-radius:50%;
 background:rgba(255,255,255,.7);
}
#buttons{
 position:absolute;right:25px;bottom:25px;
 display:flex;gap:12px;align-items:end;
 pointer-events:auto;
}
.btn{
 width:68px;height:68px;border-radius:50%;
 border:2px solid rgba(255,255,255,.4);
 background:rgba(0,0,0,.55);
 color:white;font-weight:bold;font-size:13px;
}
#enter{width:78px;height:78px;background:rgba(30,120,255,.65)}
#hint{
 position:absolute;bottom:10px;left:50%;
 transform:translateX(-50%);
 color:rgba(255,255,255,.75);font-size:12px;
}
</style>
</head>

<body>
<div id="ui">
 <div id="stats">💰 $0 &nbsp; ⭐ 0</div>
 <div id="mission">MISSION: Explore the city</div>

 <div id="joystick">
   <div id="stick"></div>
 </div>

 <div id="buttons">
   <button class="btn" id="attack">ATTACK</button>
   <button class="btn" id="enter">🚗<br>CAR</button>
 </div>

 <div id="hint">Move with the joystick</div>
</div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* ---------- SCENE ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x86b7d8);
scene.fog = new THREE.Fog(0x86b7d8,70,240);

/* ---------- CAMERA ---------- */
const camera = new THREE.PerspectiveCamera(
 60,innerWidth/innerHeight,.1,500
);

/* ---------- RENDERER ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

/* ---------- LIGHT ---------- */
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(40,80,30);
sun.castShadow=true;
scene.add(sun);

/* ---------- GROUND ---------- */
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(260,260),
 new THREE.MeshStandardMaterial({color:0x3f6940})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

/* ---------- ROAD ---------- */
function box(w,h,d,color,x,y,z){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color})
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}

const roadMat=0x303238;

/* main roads */
box(14,.08,260,roadMat,0,.04,0);
box(260,.08,14,roadMat,0,.045,0);
box(10,.08,260,roadMat,55,.05,0);
box(10,.08,260,roadMat,-55,.05,0);
box(260,.08,10,roadMat,0,.05,55);
box(260,.08,10,roadMat,0,.05,-55);

/* ---------- BUILDINGS ---------- */
function building(x,z,w,d,h,c){
 const b=box(w,h,d,c,x,h/2,z);
 return b;
}

const colors=[
  0x68727d,0x8b6d5a,0x596b75,
  0x806d91,0x697c65,0x9a765c
];

for(let x=-105;x<=105;x+=30){
 for(let z=-105;z<=105;z+=30){

  if(Math.abs(x)<20 || Math.abs(z)<20) continue;

  const w=16+Math.random()*8;
  const d=16+Math.random()*8;
  const h=8+Math.random()*22;
  const c=colors[Math.floor(Math.random()*colors.length)];

  building(x,z,w,d,h,c);

  /* windows */
  for(let yy=5;yy<h;yy+=5){
   for(let xx=-w/2+3;xx<w/2-2;xx+=5){
    const win=box(
      1.7,.8,.08,
      0x9dc4d6,
      x+xx,yy,z-d/2-.05
    );
   }
  }
 }
}

/* ---------- TREES ---------- */
function tree(x,z){
 const trunk=box(1.2,4,1.2,0x65462e,x,2,z);

 const crown=new THREE.Mesh(
  new THREE.SphereGeometry(3.8,12,10),
  new THREE.MeshStandardMaterial({color:0x285d31})
 );
 crown.position.set(x,6,z);
 crown.castShadow=true;
 scene.add(crown);
}

for(let i=0;i<70;i++){
 const x=(Math.random()-.5)*230;
 const z=(Math.random()-.5)*230;

 if(Math.abs(x)<15 || Math.abs(z)<15) continue;
 tree(x,z);
}

/* ---------- PLAYER ---------- */
const player=new THREE.Group();

const body=box(1.2,2.1,0.8,0x2266dd,0,1.05,0);
player.add(body);
scene.remove(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.55,16,12),
 new THREE.MeshStandardMaterial({color:0xf0b58b})
);
head.position.y=2.55;
head.castShadow=true;
player.add(head);

const torso=new THREE.Mesh(
 new THREE.BoxGeometry(1.2,1.5,.8),
 new THREE.MeshStandardMaterial({color:0x2266dd})
);
torso.position.y=1.2;
torso.castShadow=true;
player.add(torso);

const leg1=box(.35,1,.45,0x222222,-.3,.5,0);
const leg2=box(.35,1,.45,0x222222,.3,.5,0);
player.add(leg1);player.add(leg2);

scene.add(player);
player.position.set(0,0,20);

/* ---------- CAR ---------- */
const car=new THREE.Group();

const carBody=new THREE.Mesh(
 new THREE.BoxGeometry(4,1.2,7),
 new THREE.MeshStandardMaterial({color:0xd62d32})
);
carBody.position.y=1;
carBody.castShadow=true;
car.add(carBody);

const roof=new THREE.Mesh(
 new THREE.BoxGeometry(3.2,1.1,3),
 new THREE.MeshStandardMaterial({color:0x22262b})
);
roof.position.y=1.9;
roof.position.z=-.3;
car.add(roof);

for(const x of [-1.7,1.7]){
 for(const z of [-2.2,2.2]){
  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(.65,.65,.5,16),
   new THREE.MeshStandardMaterial({color:0x111111})
  );
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,.55,z);
  car.add(wheel);
 }
}

car.position.set(10,0,20);
scene.add(car);

/* ---------- INPUT ---------- */
let joyX=0,joyY=0;
let driving=false;

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

function moveJoy(x,y){
 const r=42;
 const len=Math.sqrt(x*x+y*y);
 if(len>r){
  x=x/len*r;
  y=y/len*r;
 }
 stick.style.transform=`translate(${x}px,${y}px)`;
 joyX=x/r;
 joyY=y/r;
}

function resetJoy(){
 joyX=0;joyY=0;
 stick.style.transform="translate(0,0)";
}

function joyStart(e){
 const p=e.touches?e.touches[0]:e;
 const r=joystick.getBoundingClientRect();
 moveJoy(p.clientX-(r.left+r.width/2),
         p.clientY-(r.top+r.height/2));
}

joystick.addEventListener("touchstart",joyStart);
joystick.addEventListener("touchmove",joyStart);
joystick.addEventListener("touchend",resetJoy);

joystick.addEventListener("mousedown",joyStart);
window.addEventListener("mousemove",e=>{
 if(e.buttons) joyStart(e);
});
window.addEventListener("mouseup",resetJoy);

/* ---------- CAR BUTTON ---------- */
document.getElementById("enter").addEventListener("click",()=>{
 const dx=player.position.x-car.position.x;
 const dz=player.position.z-car.position.z;
 const dist=Math.sqrt(dx*dx+dz*dz);

 if(dist<7){
  driving=!driving;
  document.getElementById("enter").innerHTML=
   driving ? "🚶<br>EXIT" : "🚗<br>CAR";
 }
});

/* ---------- ATTACK ---------- */
document.getElementById("attack").addEventListener("click",()=>{
 document.getElementById("mission").textContent=
 "ATTACK: No target nearby";
});

/* ---------- GAME LOOP ---------- */
const clock=new THREE.Clock();

function update(){
 const dt=Math.min(clock.getDelta(),.05);

 const speed=driving?18:8;

 const mx=joyX;
 const mz=joyY;

 if(driving){
  car.position.x+=mx*speed*dt;
  car.position.z+=mz*speed*dt;

  player.position.copy(car.position);
  player.position.y=0;
 }else{
  player.position.x+=mx*speed*dt;
  player.position.z+=mz*speed*dt;

  if(Math.abs(mx)+Math.abs(mz)>.1){
   player.rotation.y=Math.atan2(mx,mz);
  }
 }

 /* camera follows player */
 const target=driving?car:player;

 const desired=new THREE.Vector3(
  target.position.x,
  target.position.y+12,
  target.position.z+18
 );

 camera.position.lerp(desired,.08);

 const look=new THREE.Vector3(
  target.position.x,
  target.position.y+1,
  target.position.z
 );

 camera.lookAt(look);

 renderer.render(scene,camera);
 requestAnimationFrame(update);
}

update();

/* ---------- RESIZE ---------- */
addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
