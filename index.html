<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA Car Test</title>

<style>
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#87b9dc;
}
canvas{
 display:block;
}
#msg{
 position:fixed;
 top:20px;
 left:20px;
 color:white;
 background:#000b;
 padding:12px 16px;
 border-radius:10px;
 font-family:Arial;
 z-index:5;
}
</style>
</head>

<body>

<div id="msg">🚗 Loading car...</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {GLTFLoader} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* SCENE */

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x87b9dc);


/* CAMERA */

const camera =
new THREE.PerspectiveCamera(
 45,
 innerWidth/innerHeight,
 0.01,
 5000
);


/* RENDERER */

const renderer =
new THREE.WebGLRenderer({
 antialias:true
});

renderer.setSize(
 innerWidth,
 innerHeight
);

renderer.setPixelRatio(
 Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
 renderer.domElement
);


/* LIGHT */

scene.add(
 new THREE.HemisphereLight(
  0xffffff,
  0x333333,
  4
 )
);

const sun =
new THREE.DirectionalLight(
  0xffffff,
  5
);

sun.position.set(
  10,
  20,
  10
);

sun.castShadow=true;

scene.add(sun);


/* GROUND */

const ground =
new THREE.Mesh(
 new THREE.PlaneGeometry(
  200,
  200
 ),
 new THREE.MeshStandardMaterial({
  color:0x427747
 })
);

ground.rotation.x=
-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* CAR */

const loader =
new GLTFLoader();


loader.load(

 "./car.glb",

 (gltf)=>{

   const car =
   gltf.scene;


   /* add first */

   scene.add(car);


   /* shadows */

   car.traverse(
     obj=>{

       if(obj.isMesh){

         obj.castShadow=true;
         obj.receiveShadow=true;

       }

     }
   );


   /*
    FIND ORIGINAL SIZE
   */

   const box =
   new THREE.Box3()
   .setFromObject(car);


   const size =
   box.getSize(
     new THREE.Vector3()
   );


   const center =
   box.getCenter(
     new THREE.Vector3()
   );


   /*
    AUTOMATIC SCALE

    No matter how big/small
    the GLB is, it becomes
    approximately 6 units.
   */

   const biggest =
   Math.max(
     size.x,
     size.y,
     size.z
   );


   if(biggest>0){

     const scale =
     6/biggest;

     car.scale.set(
       scale,
       scale,
       scale
     );
   }


   /*
    RECALCULATE BOX
   */

   const box2 =
   new THREE.Box3()
   .setFromObject(car);


   const center2 =
   box2.getCenter(
     new THREE.Vector3()
   );


   /*
    PUT CAR ON GROUND
   */

   car.position.x -=
   center2.x;

   car.position.y -=
   box2.min.y;

   car.position.z -=
   center2.z;


   /*
    CAMERA DISTANCE
   */

   const finalSize =
   box2.getSize(
     new THREE.Vector3()
   );


   const maxFinal =
   Math.max(
     finalSize.x,
     finalSize.y,
     finalSize.z
   );


   const distance =
   maxFinal*2.2;


   camera.position.set(
     distance,
     maxFinal*.9,
     distance
   );


   camera.lookAt(
     0,
     maxFinal*.45,
     0
   );


   document
   .getElementById("msg")
   .innerHTML=
   "🚗 CAR LOADED!";


   setTimeout(
     ()=>{
       document
       .getElementById("msg")
       .style.display="none";
     },
     1500
   );


   console.log(
     "CAR SIZE:",
     size
   );

 },

 undefined,

 (error)=>{

   document
   .getElementById("msg")
   .innerHTML=
   "❌ car.glb ვერ ჩაიტვირთა";

   console.error(error);
 }
);


/* LOOP */

function animate(){

 requestAnimationFrame(
   animate
 );

 renderer.render(
   scene,
   camera
 );
}

animate();


/* RESIZE */

window.addEventListener(
 "resize",
 ()=>{

   camera.aspect =
   innerWidth/innerHeight;

   camera.updateProjectionMatrix();

   renderer.setSize(
   innerWidth,
   innerHeight
   );

 }
);

</script>

</body>
</html>
