<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SpaceCrew</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#080b18;
  color:white;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.screen{
  width:100%;
  max-width:520px;
  min-height:100%;
  padding:24px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.logo{
  text-align:center;
  font-size:44px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#9da6c7;
  margin-bottom:30px;
}

.card{
  background:#12172a;
  border:1px solid #252d4b;
  border-radius:22px;
  padding:20px;
  box-shadow:0 15px 50px #0008;
}

input{
  width:100%;
  padding:16px;
  margin-bottom:12px;
  border:1px solid #303957;
  border-radius:14px;
  background:#090d1d;
  color:white;
  font-size:17px;
  outline:none;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  margin-top:10px;
  background:#5865f2;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

.secondary{
  background:#252c45;
}

.hidden{
  display:none!important;
}

.roomCode{
  text-align:center;
  font-size:34px;
  font-weight:900;
  letter-spacing:6px;
  margin:10px 0 20px;
}

.players{
  margin-top:15px;
  max-height:45vh;
  overflow:auto;
}

.player{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin-bottom:8px;
  border-radius:14px;
  background:#0b1020;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.playerName{
  flex:1;
  font-weight:bold;
}

.host{
  font-size:12px;
  color:#7f8cff;
}

.status{
  text-align:center;
  color:#8f98ba;
  min-height:20px;
  margin-top:12px;
}

.count{
  text-align:center;
  color:#9da6c7;
  margin-bottom:8px;
}
</style>
</head>

<body>

<div id="home" class="screen">

  <div class="logo">SPACE<span style="color:#6672ff">CREW</span></div>
  <div class="subtitle">15-player online game</div>

  <div class="card">

    <input id="nameInput"
           maxlength="16"
           placeholder="Your name">

    <button onclick="createRoom()">
      CREATE ROOM
    </button>

    <input id="roomInput"
           maxlength="6"
           placeholder="Room code">

    <button class="secondary"
            onclick="joinRoom()">
      JOIN ROOM
    </button>

    <div id="homeStatus"
         class="status"></div>

  </div>
</div>


<div id="lobby" class="screen hidden">

  <div class="logo"
       style="font-size:32px">
       LOBBY
  </div>

  <div class="card">

    <div class="subtitle">
      ROOM CODE
    </div>

    <div id="roomCode"
         class="roomCode">
      ------
    </div>

    <div id="playerCount"
         class="count">
      0 / 15 players
    </div>

    <div id="players"
         class="players">
    </div>

    <button id="startButton"
            onclick="startGame()"
            class="hidden">
      START GAME
    </button>

    <button class="secondary"
            onclick="leaveRoom()">
      LEAVE ROOM
    </button>

    <div id="lobbyStatus"
         class="status">
      Waiting for players...
    </div>

  </div>
</div>


<div id="game" class="screen hidden">

  <div class="logo"
       style="font-size:34px">
       🚀 GAME
  </div>

  <div class="card"
       style="text-align:center">

    <h2>Game starting!</h2>

    <p style="color:#9da6c7">
      Multiplayer system is working.
    </p>

    <p>
      Next: map + characters + tasks + impostor.
    </p>

  </div>
</div>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://egackwuidatyuihmdhvo.supabase.co";

const SUPABASE_KEY =
"YOUR_SUPABASE_KEY";


const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   STATE
========================= */

let roomId = null;
let roomCode = null;
let playerId = null;
let isHost = false;
let realtimeChannel = null;


/* =========================
   HELPERS
========================= */

function randomCode(){

  const chars =
  "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code="";

  for(let i=0;i<6;i++){

    code +=
    chars[
      Math.floor(
        Math.random()*chars.length
      )
    ];

  }

  return code;
}


function getName(){

  const input =
  document.getElementById(
    "nameInput"
  );

  const name =
  input.value.trim();

  if(!name){

    alert("Enter your name");

    return null;
  }

  return name;
}


function showLobby(){

  document
  .getElementById("home")
  .classList.add("hidden");

  document
  .getElementById("lobby")
  .classList.remove("hidden");

}


function showGame(){

  document
  .getElementById("lobby")
  .classList.add("hidden");

  document
  .getElementById("game")
  .classList.remove("hidden");

}


/* =========================
   CREATE ROOM
========================= */

window.createRoom =
async function(){

  const name =
  getName();

  if(!name) return;


  const code =
  randomCode();


  document
  .getElementById("homeStatus")
  .textContent =
  "Creating room...";


  const {data,error} =
  await supabase
  .from("rooms")
  .insert({
    code:code,
    max_players:15,
    status:"waiting"
  })
  .select()
  .single();


  if(error){

    console.error(error);

    document
    .getElementById("homeStatus")
    .textContent =
    "Could not create room.";

    return;
  }


  roomId =
  data.id;

  roomCode =
  data.code;

  isHost=true;


  await addPlayer(name);


  openLobby();

};


/* =========================
   JOIN ROOM
========================= */

window.joinRoom =
async function(){

  const name =
  getName();

  if(!name) return;


  const input =
  document
  .getElementById("roomInput");

  const code =
  input.value
  .trim()
  .toUpperCase();


  if(code.length!==6){

    alert("Enter a 6-character room code.");

    return;
  }


  document
  .getElementById("homeStatus")
  .textContent =
  "Joining room...";


  const {data,error} =
  await supabase
  .from("rooms")
  .select("*")
  .eq("code",code)
  .single();


  if(error || !data){

    document
    .getElementById("homeStatus")
    .textContent =
    "Room not found.";

    return;
  }


  if(data.status!=="waiting"){

    document
    .getElementById("homeStatus")
    .textContent =
    "Game already started.";

    return;
  }


  const {count} =
  await supabase
  .from("players")
  .select("*",{count:"exact",head:true})
  .eq("room_id",data.id);


  if(count>=15){

    document
    .getElementById("homeStatus")
    .textContent =
    "Room is full.";

    return;
  }


  roomId =
  data.id;

  roomCode =
  data.code;

  isHost=false;


  await addPlayer(name);


  openLobby();

};


/* =========================
   ADD PLAYER
========================= */

async function addPlayer(name){

  const {data,error} =
  await supabase
  .from("players")
  .insert({
    room_id:roomId,
    name:name,
    ready:false,
    is_alive:true,
    is_impostor:false
  })
  .select()
  .single();


  if(error){

    console.error(error);

    alert(
      "Could not join the room."
    );

    return;
  }


  playerId =
  data.id;

}


/* =========================
   OPEN LOBBY
========================= */

async function openLobby(){

  showLobby();


  document
  .getElementById("roomCode")
  .textContent =
  roomCode;


  if(isHost){

    document
    .getElementById("startButton")
    .classList.remove("hidden");

  }


  await refreshPlayers();


  realtimeChannel =
  supabase
  .channel(
    "room-"+roomId
  )
  .on(
    "postgres_changes",
    {
      event:"*",
      schema:"public",
      table:"players",
      filter:
      "room_id=eq."+roomId
    },
    ()=>{
      refreshPlayers();
    }
  )
  .on(
    "postgres_changes",
    {
      event:"UPDATE",
      schema:"public",
      table:"rooms",
      filter:
      "id=eq."+roomId
    },
    payload=>{

      if(
        payload.new.status==="playing"
      ){

        showGame();

      }

    }
  )
  .subscribe();

}


/* =========================
   REFRESH PLAYERS
========================= */

async function refreshPlayers(){

  if(!roomId) return;


  const {data,error} =
  await supabase
  .from("players")
  .select("*")
  .eq("room_id",roomId)
  .order("created_at");


  if(error){

    console.error(error);

    return;
  }


  const container =
  document
  .getElementById("players");


  container.innerHTML="";


  data.forEach(
    (player,index)=>{

      const row =
      document.createElement("div");

      row.className="player";


      const avatar =
      document.createElement("div");

      avatar.className="avatar";

      avatar.textContent="👨‍🚀";


      const name =
      document.createElement("div");

      name.className="playerName";

      name.textContent =
      player.name;


      if(index===0){

        const host =
        document.createElement("div");

        host.className="host";

        host.textContent =
        "HOST";

        name.appendChild(host);

      }


      row.appendChild(avatar);

      row.appendChild(name);

      container.appendChild(row);

    }
  );


  document
  .getElementById("playerCount")
  .textContent =
  data.length+" / 15 players";

}


/* =========================
   START GAME
========================= */

window.startGame =
async function(){

  if(!isHost) return;


  const {count} =
  await supabase
  .from("players")
  .select("*",{count:"exact",head:true})
  .eq("room_id",roomId);


  if(!count || count<1){

    return;
  }


  await supabase
  .from("rooms")
  .update({
    status:"playing"
  })
  .eq("id",roomId);


  showGame();

};


/* =========================
   LEAVE
========================= */

window.leaveRoom =
async function(){

  if(playerId){

    await supabase
    .from("players")
    .delete()
    .eq("id",playerId);

  }


  if(realtimeChannel){

    await supabase.removeChannel(
      realtimeChannel
    );

  }


  location.reload();

};


/* =========================
   AUTO CLEANUP
========================= */

window.addEventListener(
  "beforeunload",
  ()=>{

    if(playerId){

      supabase
      .from("players")
      .delete()
      .eq("id",playerId);

    }

  }
);

</script>

</body>
</html>
