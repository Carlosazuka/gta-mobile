<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>City Rush 3D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#87b9dc;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
}

#stats{
  position:absolute;
  top:12px;
  left:12px;
  color:white;
  background:rgba(0,0,0,.6);
  padding:10px 14px;
  border-radius:12px;
  font-size:14px;
}

#mission{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:rgba(0,0,0,.6);
  padding:10px 18px;
  border-radius:12px;
  font-size:14px;
  white-space:nowrap;
}

#joystick{
  position:absolute;
  left:25px;
  bottom:25px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.14);
  border:2px solid rgba(255,255,255,.3);
  pointer-events:auto;
}

#stick{
  position:absolute;
  width:48px;
  height:48px;
  left:37px;
  top:37px;
  border-radius:50%;
  background:rgba(255,255,255,.78);
  box-shadow:0 3px 12px rgba(0,0,0,.3);
}

#buttons{
  position:absolute;
  right:25px;
  bottom:25px;
  display:flex;
  gap:12px;
  align-items:end;
  pointer-events:auto;
}

.btn{
  width:68px;
  height:68px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.58);
  color:white;
  font-weight:bold;
  font-size:12px;
}

#carBtn{
  width:78px;
  height:78px;
  background:rgba(30,110,255,.7);
}

#rotate{
  display:none;
  position:fixed;
  inset:0;
  z-index:99;
  background:#111;
  color:white;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

@media (orientation:portrait){
  #rotate{
    display:flex;
  }
}

@media (orientation:landscape){
  #rotate{
    display:none;
  }
}
</style>
</head>

<body>

<div id="rotate">
  📱↔️<br><br>
  Turn your phone sideways
</div>

<div id="ui">

  <div id="stats">
    💰 $0 &nbsp;&nbsp; ⭐ 0
  </div>

  <div id="mission">
    MISSION: Explore the city
  </div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="buttons">
    <button class="btn" id="attack">ATTACK</button>
    <button class="btn" id="carBtn">🚗<br>CAR</button>
  </div>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87b9dc);

scene.fog = new THREE.Fog(
  0x87b9dc,
  70,
  250
);


/* =========================
   CAMERA
========================= */

const camera =
new THREE.PerspectiveCamera(
  60,
  innerWidth / innerHeight,
  .1,
  500
);


/* =========================
   RENDERER
========================= */

const renderer =
new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
  renderer.domElement
);


/* =========================
   LIGHT
========================= */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x405060,
    2
  )
);

const sun =
new THREE.DirectionalLight(
  0xffffff,
  2
);

sun.position.set(
  40,80,30
);

sun.castShadow=true;

scene.add(sun);


/* =========================
   HELPERS
========================= */

function createBox(
  width,
  height,
  depth,
  color,
  x,
  y,
  z
){

  const mesh =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      width,
      height,
      depth
    ),
    new THREE.MeshStandardMaterial({
      color
    })
  );

  mesh.position.set(
    x,y,z
  );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);

  return mesh;
}


/* =========================
   GROUND
========================= */

const ground =
new THREE.Mesh(
  new THREE.PlaneGeometry(
    260,260
  ),
  new THREE.MeshStandardMaterial({
    color:0x3f6940
  })
);

ground.rotation.x =
-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* =========================
   ROADS
========================= */

const roadColor=0x303238;

createBox(
  14,.08,260,
  roadColor,
  0,.04,0
);

createBox(
  260,.08,14,
  roadColor,
  0,.045,0
);

createBox(
  10,.08,260,
  roadColor,
  55,.05,0
);

createBox(
  10,.08,260,
  roadColor,
  -55,.05,0
);

createBox(
  260,.08,10,
  roadColor,
  0,.05,55
);

createBox(
  260,.08,10,
  roadColor,
  0,.05,-55
);


/* =========================
   BUILDINGS
========================= */

const buildingColors=[
  0x68727d,
  0x8b6d5a,
  0x596b75,
  0x806d91,
  0x697c65,
  0x9a765c
];

for(
  let x=-105;
  x<=105;
  x+=30
){

  for(
    let z=-105;
    z<=105;
    z+=30
  ){

    if(
      Math.abs(x)<20 ||
      Math.abs(z)<20
    ) continue;

    const w=
      16+
      Math.random()*8;

    const d=
      16+
      Math.random()*8;

    const h=
      8+
      Math.random()*22;

    const color=
      buildingColors[
        Math.floor(
          Math.random()*
          buildingColors.length
        )
      ];

    createBox(
      w,h,d,
      color,
      x,h/2,z
    );
  }
}


/* =========================
   TREES
========================= */

function createTree(x,z){

  createBox(
    1.2,4,1.2,
    0x65462e,
    x,2,z
  );

  const crown =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      3.8,12,10
    ),
    new THREE.MeshStandardMaterial({
      color:0x285d31
    })
  );

  crown.position.set(
    x,6,z
  );

  crown.castShadow=true;

  scene.add(crown);
}

for(
  let i=0;
  i<70;
  i++
){

  const x=
    (Math.random()-.5)*230;

  const z=
    (Math.random()-.5)*230;

  if(
    Math.abs(x)<15 ||
    Math.abs(z)<15
  ) continue;

  createTree(x,z);
}


/* =========================
   PLAYER
========================= */

const player =
new THREE.Group();

const torso =
new THREE.Mesh(
  new THREE.BoxGeometry(
    1.2,1.5,.8
  ),
  new THREE.MeshStandardMaterial({
    color:0x2266dd
  })
);

torso.position.y=1.2;

torso.castShadow=true;

player.add(torso);


const head =
new THREE.Mesh(
  new THREE.SphereGeometry(
    .55,16,12
  ),
  new THREE.MeshStandardMaterial({
    color:0xf0b58b
  })
);

head.position.y=2.55;

head.castShadow=true;

player.add(head);


const leg1 =
createBox(
  .35,1,.45,
  0x222222,
  0,0,0
);

scene.remove(leg1);

leg1.position.set(
  -.3,.5,0
);

leg1.parent=player;


const leg2 =
createBox(
  .35,1,.45,
  0x222222,
  0,0,0
);

scene.remove(leg2);

leg2.position.set(
  .3,.5,0
);

leg2.parent=player;


player.position.set(
  0,0,20
);

scene.add(player);


/* =========================
   CAR
========================= */

const car =
new THREE.Group();

const carBody =
new THREE.Mesh(
  new THREE.BoxGeometry(
    4,1.2,7
  ),
  new THREE.MeshStandardMaterial({
    color:0xd62d32
  })
);

carBody.position.y=1;

carBody.castShadow=true;

car.add(carBody);


const roof =
new THREE.Mesh(
  new THREE.BoxGeometry(
    3.2,1.1,3
  ),
  new THREE.MeshStandardMaterial({
    color:0x22262b
  })
);

roof.position.set(
  0,1.9,-.3
);

car.add(roof);


for(
  const x of [-1.7,1.7]
){

  for(
    const z of [-2.2,2.2]
  ){

    const wheel =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .65,.65,.5,16
      ),
      new THREE.MeshStandardMaterial({
        color:0x111111
      })
    );

    wheel.rotation.z=
      Math.PI/2;

    wheel.position.set(
      x,.55,z
    );

    car.add(wheel);
  }
}

car.position.set(
  10,0,20
);

scene.add(car);


/* =========================
   JOYSTICK
========================= */

const joystick =
document.getElementById(
  "joystick"
);

const stick =
document.getElementById(
  "stick"
);

let joyX=0;
let joyY=0;

let joystickActive=false;

const MAX_DISTANCE=42;


function updateJoystick(
  clientX,
  clientY
){

  const rect=
    joystick.getBoundingClientRect();

  let x=
    clientX -
    (rect.left+
     rect.width/2);

  let y=
    clientY -
    (rect.top+
     rect.height/2);

  const distance=
    Math.sqrt(
      x*x+y*y
    );

  if(
    distance>MAX_DISTANCE
  ){

    x=
      x/distance*
      MAX_DISTANCE;

    y=
      y/distance*
      MAX_DISTANCE;
  }

  joyX=
    x/MAX_DISTANCE;

  joyY=
    y/MAX_DISTANCE;

  stick.style.transform=
    `translate(${x}px,${y}px)`;
}


function resetJoystick(){

  joystickActive=false;

  joyX=0;
  joyY=0;

  stick.style.transform=
    "translate(0,0)";
}


joystick.addEventListener(
  "touchstart",
  e=>{
    joystickActive=true;

    const t=e.touches[0];

    updateJoystick(
      t.clientX,
      t.clientY
    );
  },
  {passive:false}
);


joystick.addEventListener(
  "touchmove",
  e=>{

    if(!joystickActive)
      return;

    e.preventDefault();

    const t=e.touches[0];

    updateJoystick(
      t.clientX,
      t.clientY
    );

  },
  {passive:false}
);


joystick.addEventListener(
  "touchend",
  resetJoystick
);


/* =========================
   CAMERA RELATIVE MOVEMENT
========================= */

let driving=false;

const moveDirection=
new THREE.Vector3();

const forward=
new THREE.Vector3();

const right=
new THREE.Vector3();


function moveCharacter(dt){

  if(
    Math.abs(joyX)<.05 &&
    Math.abs(joyY)<.05
  ){
    return;
  }

  /*
    Camera's horizontal forward
  */

  camera.getWorldDirection(
    forward
  );

  forward.y=0;

  forward.normalize();

  /*
    Camera's right
  */

  right.crossVectors(
    forward,
    new THREE.Vector3(0,1,0)
  ).normalize();

  /*
    Joystick:
    up = forward
    down = backward
    right = camera right
  */

  moveDirection.set(0,0,0);

  moveDirection.addScaledVector(
    forward,
    -joyY
  );

  moveDirection.addScaledVector(
    right,
    joyX
  );

  if(
    moveDirection.lengthSq()>0.001
  ){

    moveDirection.normalize();

    const speed=
      driving ? 16 : 7;

    if(driving){

      car.position.addScaledVector(
        moveDirection,
        speed*dt
      );

      player.position.copy(
        car.position
      );

    }else{

      player.position.addScaledVector(
        moveDirection,
        speed*dt
      );
    }

    /*
      Character faces movement
    */

    if(!driving){

      const angle=
        Math.atan2(
          moveDirection.x,
          moveDirection.z
        );

      player.rotation.y=
        THREE.MathUtils.lerp(
          player.rotation.y,
          angle,
          .2
        );
    }

    /*
      Car faces movement
    */

    if(driving){

      const angle=
        Math.atan2(
          moveDirection.x,
          moveDirection.z
        );

      car.rotation.y=
        THREE.MathUtils.lerp(
          car.rotation.y,
          angle,
          .12
        );
    }
  }
}


/* =========================
   CAR ENTER / EXIT
========================= */

const carButton=
document.getElementById(
  "carBtn"
);

carButton.addEventListener(
  "click",
  ()=>{

    const distance=
      player.position.distanceTo(
        car.position
      );

    if(
      !driving &&
      distance<7
    ){

      driving=true;

      player.visible=false;

      carButton.innerHTML=
        "🚶<br>EXIT";

      document.getElementById(
        "mission"
      ).textContent=
        "Drive around the city";

    }else if(driving){

      driving=false;

      player.visible=true;

      player.position.copy(
        car.position
      );

      player.position.x+=3;

      carButton.innerHTML=
        "🚗<br>CAR";

      document.getElementById(
        "mission"
      ).textContent=
        "MISSION: Explore the city";
    }
  }
);


/* =========================
   ATTACK
========================= */

document
.getElementById("attack")
.addEventListener(
  "click",
  ()=>{

    document.getElementById(
      "mission"
    ).textContent=
      "👊 Attack activated!";
  }
);


/* =========================
   CAMERA FOLLOW
========================= */

const cameraTarget=
new THREE.Vector3();

const desiredCamera=
new THREE.Vector3();

const cameraOffset=
new THREE.Vector3(
  0,10,15
);


/* =========================
   GAME LOOP
========================= */

const clock=
new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );

  moveCharacter(dt);

  const target=
    driving ?
    car :
    player;

  cameraTarget.lerp(
    target.position,
    .12
  );

  /*
    Camera stays behind
    player's movement direction
  */

  let targetRotation=
    driving ?
    car.rotation.y :
    player.rotation.y;

  const distance=17;

  desiredCamera.set(
    target.position.x -
      Math.sin(targetRotation)*
      distance,

    target.position.y+
      9,

    target.position.z -
      Math.cos(targetRotation)*
      distance
  );

  camera.position.lerp(
    desiredCamera,
    .08
  );

  camera.lookAt(
    target.position.x,
    target.position.y+1.2,
    target.position.z
  );

  renderer.render(
    scene,
    camera
  );
}

animate();


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

</script>

</body>
</html>
