/* =====================================================
   JOYSTICK
===================================================== */

const joystick=
document.getElementById(
 "joystick"
);

const stick=
document.getElementById(
 "stick"
);

let joyX=0;
let joyY=0;
let joyId=null;

const JR=45;


function joystickMove(
 x,y
){

 const r=
  joystick.getBoundingClientRect();

 let dx=
  x-
  (r.left+r.width/2);

 let dy=
  y-
  (r.top+r.height/2);

 const len=
  Math.hypot(dx,dy);

 if(len>JR){

  dx=
   dx/len*JR;

  dy=
   dy/len*JR;
 }

 joyX=dx/JR;
 joyY=dy/JR;

 stick.style.transform=
  `translate(${dx}px,${dy}px)`;
}


joystick.addEventListener(
 "touchstart",
 e=>{

  const t=
   e.changedTouches[0];

  joyId=t.identifier;

  joystickMove(
   t.clientX,
   t.clientY
  );
 },
 {passive:false}
);


joystick.addEventListener(
 "touchmove",
 e=>{

  e.preventDefault();

  for(
   const t of e.changedTouches
  ){

   if(
    t.identifier===
    joyId
   ){

    joystickMove(
     t.clientX,
     t.clientY
    );
   }
  }
 },
 {passive:false}
);


joystick.addEventListener(
 "touchend",
 ()=>{

  joyId=null;

  joyX=0;
  joyY=0;

  stick.style.transform=
   "translate(0,0)";
 }
);


/* =====================================================
   CAMERA TOUCH
===================================================== */

const look=
document.getElementById(
 "look"
);

let lookId=null;
let lastX=0;
let lastY=0;

let yaw=0;
let pitch=.38;


look.addEventListener(
 "touchstart",
 e=>{

  const t=
   e.changedTouches[0];

  lookId=t.identifier;

  lastX=t.clientX;
  lastY=t.clientY;
 },
 {passive:false}
);


look.addEventListener(
 "touchmove",
 e=>{

  e.preventDefault();

  for(
   const t of e.changedTouches
  ){

   if(
    t.identifier!==
    lookId
   ) continue;

   const dx=
    t.clientX-lastX;

   const dy=
    t.clientY-lastY;

   lastX=t.clientX;
   lastY=t.clientY;

   yaw-=dx*.012;

   pitch-=dy*.008;

   pitch=
    THREE.MathUtils.clamp(
     pitch,
     -.2,
     1
    );
  }
 },
 {passive:false}
);


look.addEventListener(
 "touchend",
 ()=>{
  lookId=null;
 }
);

 if(
  Math.abs(joyX)<.03 &&
  Math.abs(joyY)<.03
 ) return;


 forward.set(
  -Math.sin(yaw),
  0,
  -Math.cos(yaw)
 );

 right.set(
  Math.cos(yaw),
  0,
  -Math.sin(yaw)
 );


 movement.set(
  0,0,0
 );


 movement.addScaledVector(
  forward,
  -joyY
 );

 movement.addScaledVector(
  right,
  joyX
 );


 if(
  movement.lengthSq()<.001
 ) return;


 movement.normalize();


 const speed=
  driving?
  21:
  7;


 if(driving){

  playerCar.position.addScaledVector(
   movement,
   speed*dt
  );

  player.position.copy(
   playerCar.position
  );

  playerCar.rotation.y=
   Math.atan2(
    movement.x,
    movement.z
   );

 }else{

  player.position.addScaledVector(
   movement,
   speed*dt
  );

  player.rotation.y=
   Math.atan2(
    movement.x,
    movement.z
   );
 }
}


/* =====================================================
   CAR BUTTON
===================================================== */

document
.getElementById("carButton")
.addEventListener(
 "click",
 ()=>{

  const distance=
   player.position.distanceTo(
    playerCar.position
   );


  if(
   !driving &&
   distance<8
  ){

   driving=true;

   player.visible=false;

   document.getElementById(
    "carButton"
   ).innerHTML=
    "🚶<br>EXIT";

  }else if(driving){

   driving=false;

   player.visible=true;

   player.position.copy(
    playerCar.position
   );

   player.position.x+=3;

   document.getElementById(
    "carButton"
   ).innerHTML=
    "🚗<br>CAR";
  }
 }
);


/* =====================================================
   TRAFFIC AI
===================================================== */

function updateTraffic(dt){

 for(
  const t of traffic
 ){

  if(t.horizontal){

   t.car.position.x+=
    t.speed*
    t.dir*
    dt;

   if(
    t.car.position.x>210
   )
    t.car.position.x=-210;

   if(
    t.car.position.x<-210
   )
    t.car.position.x=210;

   t.car.rotation.y=
    t.dir>0?
    Math.PI/2:
    -Math.PI/2;

  }else{

   t.car.position.z+=
    t.speed*
    t.dir*
    dt;

   if(
    t.car.position.z>210
   )
    t.car.position.z=-210;

   if(
    t.car.position.z<-210
   )
    t.car.position.z=210;

   t.car.rotation.y=
    t.dir>0?
    0:
    Math.PI;
  }
 }
}


/* =====================================================
   NPC AI
===================================================== */

function updateNPCs(dt){

 for(
  const n of npcs
 ){

  n.angle+=
   (Math.random()-.5)*
   dt;

  n.object.position.x+=
   Math.sin(n.angle)*
   n.speed*
   dt;

  n.object.position.z+=
   Math.cos(n.angle)*
   n.speed*
   dt;

  if(
   n.object.position.x>175
  )
   n.object.position.x=-175;

  if(
   n.object.position.x<-175
  )
   n.object.position.x=175;

  if(
   n.object.position.z>175
  )
   n.object.position.z=-175;

  if(
   n.object.position.z<-175
  )
   n.object.position.z=175;
 }
}


/* =====================================================
   CAMERA
===================================================== */

const camPos=
new THREE.Vector3();

const camTarget=
new THREE.Vector3();


function updateCamera(){

 const focus=
  driving?
  playerCar:
  player;

 const distance=17;

 const horizontal=
  Math.cos(pitch)*
  distance;


 camPos.set(

  focus.position.x+
   Math.sin(yaw)*
   horizontal,

  focus.position.y+
   4+
   Math.sin(pitch)*
   distance,

  focus.position.z+
   Math.cos(yaw)*
   horizontal
 );


 camera.position.lerp(
  camPos,
  .12
 );


 camTarget.set(
  focus.position.x,
  focus.position.y+1.3,
  focus.position.z
 );


 camera.lookAt(
  camTarget
 );
}


/* =====================================================
   ACTION
===================================================== */

let wanted=0;

document
.getElementById("action")
.addEventListener(
 "click",
 ()=>{

  wanted=
   Math.min(
    5,
    wanted+1
   );

  document.getElementById(
   "stats"
  ).innerHTML=
   `❤️ 100 &nbsp; 💵 $250 &nbsp; ⭐ ${wanted}`;
 }
);


/* =====================================================
   LOOP
===================================================== */

const clock=
new THREE.Clock();


function animate(){

 requestAnimationFrame(
  animate
 );

 const dt=
  Math.min(
   clock.getDelta(),
   .05
  );

 updateMovement(dt);
 updateTraffic(dt);
 updateNPCs(dt);
 updateCamera();

 renderer.render(
  scene,
  camera
 );
}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);

</script>
