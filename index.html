<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Car Test</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#87b9dc;
}

canvas{
  display:block;
}
</style>
</head>

<body>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {GLTFLoader}
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* SCENE */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x87b9dc);


/* CAMERA */

const camera =
new THREE.PerspectiveCamera(
 45,
 innerWidth/innerHeight,
 .1,
 1000
);

camera.position.set(
 6,
 4,
 8
);


/* RENDERER */

const renderer =
new THREE.WebGLRenderer({
 antialias:true
});

renderer.setSize(
 innerWidth,
 innerHeight
);

renderer.setPixelRatio(
 Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
 renderer.domElement
);


/* LIGHT */

const light =
new THREE.HemisphereLight(
 0xffffff,
 0x444444,
 3
);

scene.add(light);


const sun =
new THREE.DirectionalLight(
 0xffffff,
 4
);

sun.position.set(
 5,
 10,
 5
);

sun.castShadow=true;

scene.add(sun);


/* GROUND */

const ground =
new THREE.Mesh(
 new THREE.PlaneGeometry(
  100,
  100
 ),
 new THREE.MeshStandardMaterial({
  color:0x427747
 })
);

ground.rotation.x=
-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* ==================================================
   LOAD YOUR car.glb
================================================== */

const loader =
new GLTFLoader();


loader.load(

 "./car.glb",

 function(gltf){

   const car =
   gltf.scene;


   /* ავტომატურად ვპოულობთ ზომას */

   const box =
   new THREE.Box3()
   .setFromObject(car);


   const size =
   box.getSize(
     new THREE.Vector3()
   );


   const maxSize =
   Math.max(
     size.x,
     size.y,
     size.z
   );


   /* ავტომატური მასშტაბი */

   const scale =
   5 / maxSize;


   car.scale.set(
     scale,
     scale,
     scale
   );


   /* ცენტრში მოთავსება */

   const newBox =
   new THREE.Box3()
   .setFromObject(car);


   const center =
   newBox.getCenter(
     new THREE.Vector3()
   );


   car.position.x =
   -center.x;

   car.position.y =
   -newBox.min.y;

   car.position.z =
   -center.z;


   /* shadows */

   car.traverse(
     object=>{

       if(
         object.isMesh
       ){

         object.castShadow=true;

         object.receiveShadow=true;

       }

     }
   );


   scene.add(car);


   console.log(
     "CAR LOADED!",
     size
   );

 },

 undefined,

 function(error){

   console.error(
     "CAR LOAD ERROR:",
     error
   );

   document.body.innerHTML=
   "<h1 style='color:white;text-align:center;margin-top:40px'>"+
   "❌ car.glb ვერ ჩაიტვირთა"+
   "</h1>";
 }
);


/* CAMERA */

function animate(){

 requestAnimationFrame(
   animate
 );

 renderer.render(
   scene,
   camera
 );
}

animate();


/* RESIZE */

window.addEventListener(
 "resize",
 ()=>{

   camera.aspect=
   innerWidth/innerHeight;

   camera.updateProjectionMatrix();

   renderer.setSize(
   innerWidth,
   innerHeight
   );

 }
);

</script>

</body>
</html>
