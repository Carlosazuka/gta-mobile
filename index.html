<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>City Rush 3D</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#80b5d8;font-family:Arial}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;top:12px;left:12px;color:#fff;background:#0009;padding:10px 14px;border-radius:12px;font-size:14px}
#mission{position:absolute;top:12px;left:50%;transform:translateX(-50%);color:white;background:#0009;padding:10px 18px;border-radius:12px}
#joystick{position:absolute;left:24px;bottom:25px;width:130px;height:130px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;pointer-events:auto}
#stick{position:absolute;left:39px;top:39px;width:48px;height:48px;border-radius:50%;background:#fffC}
#look{position:absolute;right:0;top:0;width:58%;height:100%;pointer-events:auto}
#buttons{position:absolute;right:24px;bottom:25px;display:flex;gap:12px;pointer-events:auto}
button{border:2px solid #ffffff55;background:#0009;color:white;border-radius:50%;width:70px;height:70px;font-weight:bold}
#carBtn{width:82px;height:82px;background:#1675e8bb}
#rotate{display:none;position:fixed;inset:0;z-index:99;background:#111;color:white;align-items:center;justify-content:center;text-align:center;font-size:22px}
@media(orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>

<div id="rotate">📱↔️<br><br>TURN PHONE SIDEWAYS</div>

<div id="ui">
<div id="top">❤️ 100 &nbsp; 💰 $250 &nbsp; ⭐ 0</div>
<div id="mission">MISSION: Explore the city</div>

<div id="joystick"><div id="stick"></div></div>
<div id="look"></div>

<div id="buttons">
<button id="attack">👊</button>
<button id="carBtn">🚗<br>CAR</button>
</div>
</div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =========================
SCENE
========================= */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x80b5d8);
scene.fog=new THREE.Fog(0x80b5d8,70,260);

const camera=new THREE.PerspectiveCamera(
60,innerWidth/innerHeight,.1,600
);

const renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);


/* LIGHT */

scene.add(new THREE.HemisphereLight(0xffffff,0x405060,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(60,100,40);
sun.castShadow=true;
scene.add(sun);


/* =========================
HELPER
========================= */

function cube(w,h,d,c,x,y,z){

const m=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({color:c})
);

m.position.set(x,y,z);
m.castShadow=true;
m.receiveShadow=true;

scene.add(m);
return m;
}


/* =========================
GROUND
========================= */

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(320,320),
new THREE.MeshStandardMaterial({color:0x416b43})
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);


/* =========================
CITY ROADS
========================= */

const road=0x303238;

cube(16,.08,320,road,0,.04,0);
cube(320,.08,16,road,0,.05,0);

cube(12,.08,320,road,65,.05,0);
cube(12,.08,320,road,-65,.05,0);

cube(320,.08,12,road,0,.05,65);
cube(320,.08,12,road,0,.05,-65);


/* =========================
BUILDINGS
========================= */

const buildingColors=[
0x5d6973,
0x806653,
0x596b75,
0x725f80,
0x65745e,
0x927058
];

for(let x=-130;x<=130;x+=32){

for(let z=-130;z<=130;z+=32){

if(Math.abs(x)<24||Math.abs(z)<24)continue;

const w=18+Math.random()*9;
const d=18+Math.random()*9;
const h=10+Math.random()*30;
const c=buildingColors[
Math.floor(Math.random()*buildingColors.length)
];

cube(w,h,d,c,x,h/2,z);

/* roof */
cube(w+.2,.35,d+.2,0x33383d,x,h+.15,z);

}
}


/* =========================
TREES
========================= */

function makeTree(x,z){

cube(1.1,4,1.1,0x68472e,x,2,z);

const crown=new THREE.Mesh(
new THREE.SphereGeometry(3.6,12,10),
new THREE.MeshStandardMaterial({color:0x245a31})
);

crown.position.set(x,6,z);
crown.castShadow=true;
scene.add(crown);
}

for(let i=0;i<90;i++){

const x=(Math.random()-.5)*290;
const z=(Math.random()-.5)*290;

if(Math.abs(x)<18||Math.abs(z)<18)continue;

makeTree(x,z);
}


/* =========================
PLAYER
========================= */

const player=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(1.25,1.6,.8),
new THREE.MeshStandardMaterial({color:0x1769d1})
);

body.position.y=1.25;
body.castShadow=true;
player.add(body);

const head=new THREE.Mesh(
new THREE.SphereGeometry(.56,16,12),
new THREE.MeshStandardMaterial({color:0xf0b58b})
);

head.position.y=2.55;
head.castShadow=true;
player.add(head);

function leg(x){

const l=new THREE.Mesh(
new THREE.BoxGeometry(.36,1,.45),
new THREE.MeshStandardMaterial({color:0x20242a})
);

l.position.set(x,.5,0);
player.add(l);
}

leg(-.3);
leg(.3);

player.position.set(0,0,20);
scene.add(player);


/* =========================
CARS
========================= */

function makeCar(color,x,z){

const g=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(4,1.2,7),
new THREE.MeshStandardMaterial({color})
);

body.position.y=1;
body.castShadow=true;
g.add(body);

const roof=new THREE.Mesh(
new THREE.BoxGeometry(3.2,1.1,3),
new THREE.MeshStandardMaterial({color:0x20252a})
);

roof.position.set(0,1.9,-.3);
g.add(roof);

for(const xx of[-1.75,1.75]){
for(const zz of[-2.2,2.2]){

const w=new THREE.Mesh(
new THREE.CylinderGeometry(.65,.65,.5,16),
new THREE.MeshStandardMaterial({color:0x101010})
);

w.rotation.z=Math.PI/2;
w.position.set(xx,.55,zz);
g.add(w);
}
}

g.position.set(x,0,z);
scene.add(g);
return g;
}

const car=makeCar(0xd82f36,10,20);

makeCar(0x286fd1,-15,8);
makeCar(0xe0a92e,18,-18);
makeCar(0x7a43c7,-20,-25);


/* =========================
NPCs
========================= */

const npcs=[];

function makeNPC(x,z){

const n=new THREE.Group();

const b=new THREE.Mesh(
new THREE.BoxGeometry(1,1.6,.7),
new THREE.MeshStandardMaterial({
color:Math.random()*0xffffff
})
);

b.position.y=1.1;
n.add(b);

const h=new THREE.Mesh(
new THREE.SphereGeometry(.45,12,10),
new THREE.MeshStandardMaterial({
color:0xe0a17c
})
);

h.position.y=2.25;
n.add(h);

n.position.set(x,0,z);

scene.add(n);
npcs.push({
object:n,
angle:Math.random()*Math.PI*2,
speed:.8+Math.random()*1.3
});
}

for(let i=0;i<18;i++){

makeNPC(
(Math.random()-.5)*180,
(Math.random()-.5)*180
);
}


/* =========================
TOUCH JOYSTICK
========================= */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyX=0;
let joyY=0;
let joyId=null;

const JR=44;

function joystickMove(x,y){

const r=joystick.getBoundingClientRect();

let dx=x-(r.left+r.width/2);
let dy=y-(r.top+r.height/2);

const len=Math.hypot(dx,dy);

if(len>JR){
dx=dx/len*JR;
dy=dy/len*JR;
}

joyX=dx/JR;
joyY=dy/JR;

stick.style.transform=
`translate(${dx}px,${dy}px)`;
}

joystick.addEventListener("touchstart",e=>{
const t=e.changedTouches[0];
joyId=t.identifier;
joystickMove(t.clientX,t.clientY);
},{passive:false});

joystick.addEventListener("touchmove",e=>{
e.preventDefault();

for(const t of e.changedTouches){
if(t.identifier===joyId)
joystickMove(t.clientX,t.clientY);
}
},{passive:false});

joystick.addEventListener("touchend",e=>{
for(const t of e.changedTouches){

if(t.identifier===joyId){

joyId=null;
joyX=0;
joyY=0;

stick.style.transform="translate(0,0)";
}
}
});


/* =========================
REAL CAMERA SWIPE
========================= */

const look=document.getElementById("look");

let lookId=null;
let lastLookX=0;
let lastLookY=0;

let yaw=0;
let pitch=.35;

look.addEventListener("touchstart",e=>{

const t=e.changedTouches[0];

lookId=t.identifier;

lastLookX=t.clientX;
lastLookY=t.clientY;

},{passive:false});


look.addEventListener("touchmove",e=>{

e.preventDefault();

for(const t of e.changedTouches){

if(t.identifier!==lookId)continue;

const dx=t.clientX-lastLookX;
const dy=t.clientY-lastLookY;

lastLookX=t.clientX;
lastLookY=t.clientY;

yaw-=dx*.012;
pitch-=dy*.008;

pitch=THREE.MathUtils.clamp(
pitch,
-.15,
1.1
);
}

},{passive:false});


look.addEventListener("touchend",e=>{

for(const t of e.changedTouches){

if(t.identifier===lookId)
lookId=null;
}
});


/* =========================
MOVEMENT
========================= */

let driving=false;

const forward=new THREE.Vector3();
const right=new THREE.Vector3();
const movement=new THREE.Vector3();

function updatePlayer(dt){

if(
Math.abs(joyX)<.04 &&
Math.abs(joyY)<.04
)return;

forward.set(
-Math.sin(yaw),
0,
-Math.cos(yaw)
);

right.set(
Math.cos(yaw),
0,
-Math.sin(yaw)
);

movement.set(0,0,0);

movement.addScaledVector(
forward,
-joyY
);

movement.addScaledVector(
right,
joyX
);

if(movement.lengthSq()<.001)return;

movement.normalize();

const speed=driving?18:7;

const target=driving?car:player;

target.position.addScaledVector(
movement,
speed*dt
);

if(driving){

player.position.copy(car.position);

car.rotation.y=
Math.atan2(
movement.x,
movement.z
);

}else{

player.rotation.y=
Math.atan2(
movement.x,
movement.z
);
}
}


/* =========================
CAR ENTER
========================= */

const carBtn=document.getElementById("carBtn");

carBtn.addEventListener("click",()=>{

const d=player.position.distanceTo(
car.position
);

if(!driving&&d<7){

driving=true;
player.visible=false;

carBtn.innerHTML="🚶<br>EXIT";

document.getElementById("mission").textContent=
"Drive through the city";

}else if(driving){

driving=false;
player.visible=true;

player.position.copy(car.position);
player.position.x+=3;

carBtn.innerHTML="🚗<br>CAR";

document.getElementById("mission").textContent=
"MISSION: Explore the city";
}
});


/* =========================
ATTACK
========================= */

let wanted=0;

document.getElementById("attack")
.addEventListener("click",()=>{

wanted=Math.min(5,wanted+1);

document.getElementById("top").innerHTML=
`❤️ 100 &nbsp; 💰 $250 &nbsp; ⭐ ${wanted}`;

document.getElementById("mission").textContent=
"⚠️ Police alerted!";
});


/* =========================
NPC AI
========================= */

function updateNPCs(dt){

for(const n of npcs){

n.angle+=
(Math.random()-.5)*dt;

n.object.position.x+=
Math.sin(n.angle)*
n.speed*dt;

n.object.position.z+=
Math.cos(n.angle)*
n.speed*dt;

if(n.object.position.x>145)
n.object.position.x=-145;

if(n.object.position.x<-145)
n.object.position.x=145;

if(n.object.position.z>145)
n.object.position.z=-145;

if(n.object.position.z<-145)
n.object.position.z=145;
}
}


/* =========================
CAMERA
========================= */

const camPos=new THREE.Vector3();
const camLook=new THREE.Vector3();

function updateCamera(){

const target=
driving?car:player;

const distance=15;

const horizontal=
Math.cos(pitch)*distance;

camPos.set(

target.position.x+
Math.sin(yaw)*horizontal,

target.position.y+
5+
Math.sin(pitch)*distance,

target.position.z+
Math.cos(yaw)*horizontal

);

camera.position.lerp(
camPos,
.12
);

camLook.set(
target.position.x,
target.position.y+1.3,
target.position.z
);

camera.lookAt(camLook);
}


/* =========================
GAME LOOP
========================= */

const clock=new THREE.Clock();

function loop(){

requestAnimationFrame(loop);

const dt=
Math.min(clock.getDelta(),.05);

updatePlayer(dt);
updateNPCs(dt);
updateCamera();

renderer.render(
scene,
camera
);
}

loop();


/* =========================
RESIZE
========================= */

window.addEventListener("resize",()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);
});

</script>
</body>
</html>
