<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>City Rush 3D</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#87b9dc;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
}

#stats{
  position:absolute;
  top:12px;
  left:12px;
  color:#fff;
  background:rgba(0,0,0,.6);
  padding:10px 14px;
  border-radius:12px;
  font-size:14px;
}

#mission{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  background:rgba(0,0,0,.6);
  padding:10px 18px;
  border-radius:12px;
  white-space:nowrap;
}

#joystick{
  position:absolute;
  left:25px;
  bottom:25px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.14);
  border:2px solid rgba(255,255,255,.3);
  pointer-events:auto;
}

#stick{
  position:absolute;
  left:37px;
  top:37px;
  width:48px;
  height:48px;
  border-radius:50%;
  background:rgba(255,255,255,.8);
}

#cameraArea{
  position:absolute;
  right:0;
  top:0;
  width:55%;
  height:100%;
  pointer-events:auto;
}

#buttons{
  position:absolute;
  right:25px;
  bottom:25px;
  display:flex;
  gap:12px;
  pointer-events:auto;
  z-index:5;
}

.btn{
  width:68px;
  height:68px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.6);
  color:white;
  font-weight:bold;
  font-size:12px;
}

#carBtn{
  width:78px;
  height:78px;
  background:rgba(30,110,255,.72);
}

#rotate{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#111;
  color:white;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

@media(max-width:700px) and (orientation:portrait){
  #rotate{
    display:flex;
  }
}
</style>
</head>

<body>

<div id="rotate">
  📱↔️<br><br>
  Turn your phone sideways
</div>

<div id="ui">

  <div id="stats">
    💰 $0 &nbsp;&nbsp; ⭐ 0
  </div>

  <div id="mission">
    MISSION: Explore the city
  </div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="cameraArea"></div>

  <div id="buttons">
    <button class="btn" id="attack">
      ATTACK
    </button>

    <button class="btn" id="carBtn">
      🚗<br>CAR
    </button>
  </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================
   SCENE
========================= */

const scene=new THREE.Scene();

scene.background=
new THREE.Color(0x87b9dc);

scene.fog=
new THREE.Fog(
  0x87b9dc,
  70,
  250
);


/* =========================
   CAMERA
========================= */

const camera=
new THREE.PerspectiveCamera(
  60,
  innerWidth/innerHeight,
  .1,
  500
);


/* =========================
   RENDERER
========================= */

const renderer=
new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
  renderer.domElement
);


/* =========================
   LIGHT
========================= */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x405060,
    2
  )
);

const sun=
new THREE.DirectionalLight(
  0xffffff,
  2
);

sun.position.set(
  40,80,30
);

sun.castShadow=true;

scene.add(sun);


/* =========================
   BOX
========================= */

function box(
  w,h,d,
  color,
  x,y,z
){

  const mesh=
  new THREE.Mesh(
    new THREE.BoxGeometry(
      w,h,d
    ),
    new THREE.MeshStandardMaterial({
      color
    })
  );

  mesh.position.set(
    x,y,z
  );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);

  return mesh;
}


/* =========================
   GROUND
========================= */

const ground=
new THREE.Mesh(
  new THREE.PlaneGeometry(
    260,260
  ),
  new THREE.MeshStandardMaterial({
    color:0x3f6940
  })
);

ground.rotation.x=
-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* =========================
   ROADS
========================= */

const road=0x303238;

box(14,.08,260,road,0,.04,0);
box(260,.08,14,road,0,.05,0);

box(10,.08,260,road,55,.05,0);
box(10,.08,260,road,-55,.05,0);

box(260,.08,10,road,0,.05,55);
box(260,.08,10,road,0,.05,-55);


/* =========================
   BUILDINGS
========================= */

const buildingColors=[
  0x68727d,
  0x8b6d5a,
  0x596b75,
  0x806d91,
  0x697c65,
  0x9a765c
];

for(
  let x=-105;
  x<=105;
  x+=30
){

  for(
    let z=-105;
    z<=105;
    z+=30
  ){

    if(
      Math.abs(x)<20 ||
      Math.abs(z)<20
    ) continue;

    const w=
      16+Math.random()*8;

    const d=
      16+Math.random()*8;

    const h=
      8+Math.random()*22;

    const c=
      buildingColors[
        Math.floor(
          Math.random()*
          buildingColors.length
        )
      ];

    box(
      w,h,d,
      c,
      x,h/2,z
    );
  }
}


/* =========================
   TREES
========================= */

function tree(x,z){

  box(
    1.2,4,1.2,
    0x65462e,
    x,2,z
  );

  const crown=
  new THREE.Mesh(
    new THREE.SphereGeometry(
      3.8,12,10
    ),
    new THREE.MeshStandardMaterial({
      color:0x285d31
    })
  );

  crown.position.set(
    x,6,z
  );

  crown.castShadow=true;

  scene.add(crown);
}

for(
  let i=0;
  i<70;
  i++
){

  const x=
    (Math.random()-.5)*230;

  const z=
    (Math.random()-.5)*230;

  if(
    Math.abs(x)<15 ||
    Math.abs(z)<15
  ) continue;

  tree(x,z);
}


/* =========================
   PLAYER
========================= */

const player=
new THREE.Group();

const torso=
new THREE.Mesh(
  new THREE.BoxGeometry(
    1.2,1.5,.8
  ),
  new THREE.MeshStandardMaterial({
    color:0x2266dd
  })
);

torso.position.y=1.2;

torso.castShadow=true;

player.add(torso);


const head=
new THREE.Mesh(
  new THREE.SphereGeometry(
    .55,16,12
  ),
  new THREE.MeshStandardMaterial({
    color:0xf0b58b
  })
);

head.position.y=2.55;

head.castShadow=true;

player.add(head);


const leg1=
new THREE.Mesh(
  new THREE.BoxGeometry(
    .35,1,.45
  ),
  new THREE.MeshStandardMaterial({
    color:0x222222
  })
);

leg1.position.set(
  -.3,.5,0
);

player.add(leg1);


const leg2=
new THREE.Mesh(
  new THREE.BoxGeometry(
    .35,1,.45
  ),
  new THREE.MeshStandardMaterial({
    color:0x222222
  })
);

leg2.position.set(
  .3,.5,0
);

player.add(leg2);


player.position.set(
  0,0,20
);

scene.add(player);


/* =========================
   CAR
========================= */

const car=
new THREE.Group();

const carBody=
new THREE.Mesh(
  new THREE.BoxGeometry(
    4,1.2,7
  ),
  new THREE.MeshStandardMaterial({
    color:0xd62d32
  })
);

carBody.position.y=1;

carBody.castShadow=true;

car.add(carBody);


const roof=
new THREE.Mesh(
  new THREE.BoxGeometry(
    3.2,1.1,3
  ),
  new THREE.MeshStandardMaterial({
    color:0x22262b
  })
);

roof.position.set(
  0,1.9,-.3
);

car.add(roof);


for(
  const x of [-1.7,1.7]
){

  for(
    const z of [-2.2,2.2]
  ){

    const wheel=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .65,.65,.5,16
      ),
      new THREE.MeshStandardMaterial({
        color:0x111111
      })
    );

    wheel.rotation.z=
      Math.PI/2;

    wheel.position.set(
      x,.55,z
    );

    car.add(wheel);
  }
}

car.position.set(
  10,0,20
);

scene.add(car);


/* =========================
   JOYSTICK
========================= */

const joystick=
document.getElementById(
  "joystick"
);

const stick=
document.getElementById(
  "stick"
);

let joyX=0;
let joyY=0;

let joyTouchId=null;

const MAX=42;


function setJoystick(
  x,y
){

  const rect=
    joystick.getBoundingClientRect();

  let dx=
    x-
    (rect.left+
     rect.width/2);

  let dy=
    y-
    (rect.top+
     rect.height/2);

  const len=
    Math.sqrt(
      dx*dx+dy*dy
    );

  if(len>MAX){

    dx=
      dx/len*MAX;

    dy=
      dy/len*MAX;
  }

  joyX=dx/MAX;
  joyY=dy/MAX;

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;
}


joystick.addEventListener(
  "touchstart",
  e=>{

    const t=e.changedTouches[0];

    joyTouchId=t.identifier;

    setJoystick(
      t.clientX,
      t.clientY
    );

  },
  {passive:false}
);


joystick.addEventListener(
  "touchmove",
  e=>{

    e.preventDefault();

    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier===
        joyTouchId
      ){

        setJoystick(
          t.clientX,
          t.clientY
        );
      }
    }

  },
  {passive:false}
);


joystick.addEventListener(
  "touchend",
  e=>{

    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier===
        joyTouchId
      ){

        joyTouchId=null;

        joyX=0;
        joyY=0;

        stick.style.transform=
          "translate(0,0)";
      }
    }

  }
);


/* =========================
   CAMERA SWIPE
========================= */

const cameraArea=
document.getElementById(
  "cameraArea"
);

let cameraTouchId=null;

let lastX=0;
let lastY=0;

let cameraYaw=0;
let cameraPitch=.45;

cameraArea.addEventListener(
  "touchstart",
  e=>{

    const t=e.changedTouches[0];

    cameraTouchId=
      t.identifier;

    lastX=t.clientX;
    lastY=t.clientY;

  },
  {passive:false}
);


cameraArea.addEventListener(
  "touchmove",
  e=>{

    e.preventDefault();

    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier===
        cameraTouchId
      ){

        const dx=
          t.clientX-lastX;

        const dy=
          t.clientY-lastY;

        lastX=t.clientX;
        lastY=t.clientY;

        cameraYaw-=dx*.008;

        cameraPitch-=
          dy*.005;

        cameraPitch=
          THREE.MathUtils.clamp(
            cameraPitch,
            .15,
            1.05
          );
      }
    }

  },
  {passive:false}
);


cameraArea.addEventListener(
  "touchend",
  e=>{

    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier===
        cameraTouchId
      ){

        cameraTouchId=null;
      }
    }

  }
);


/* =========================
   MOVEMENT
========================= */

let driving=false;

const forward=
new THREE.Vector3();

const right=
new THREE.Vector3();

const move=
new THREE.Vector3();


function updateMovement(dt){

  if(
    Math.abs(joyX)<.04 &&
    Math.abs(joyY)<.04
  ) return;


  /*
    Camera direction
  */

  forward.set(
    -Math.sin(cameraYaw),
    0,
    -Math.cos(cameraYaw)
  );

  right.set(
    Math.cos(cameraYaw),
    0,
    -Math.sin(cameraYaw)
  );


  /*
    Joystick movement
  */

  move.set(0,0,0);

  move.addScaledVector(
    forward,
    -joyY
  );

  move.addScaledVector(
    right,
    joyX
  );

  if(
    move.lengthSq()<
    .001
  ) return;

  move.normalize();


  const speed=
    driving ? 17 : 7;


  if(driving){

    car.position.addScaledVector(
      move,
      speed*dt
    );

    player.position.copy(
      car.position
    );

  }else{

    player.position.addScaledVector(
      move,
      speed*dt
    );

    /*
      Character faces movement
    */

    const angle=
      Math.atan2(
        move.x,
        move.z
      );

    player.rotation.y=
      THREE.MathUtils.lerp(
        player.rotation.y,
        angle,
        .18
      );
  }


  if(driving){

    const angle=
      Math.atan2(
        move.x,
        move.z
      );

    car.rotation.y=
      THREE.MathUtils.lerp(
        car.rotation.y,
        angle,
        .12
      );
  }
}


/* =========================
   CAR BUTTON
========================= */

const carBtn=
document.getElementById(
  "carBtn"
);

carBtn.addEventListener(
  "click",
  ()=>{

    const distance=
      player.position.distanceTo(
        car.position
      );

    if(
      !driving &&
      distance<7
    ){

      driving=true;

      player.visible=false;

      carBtn.innerHTML=
        "🚶<br>EXIT";

      document.getElementById(
        "mission"
      ).textContent=
        "Drive around the city";

    }else if(driving){

      driving=false;

      player.visible=true;

      player.position.copy(
        car.position
      );

      player.position.x+=3;

      carBtn.innerHTML=
        "🚗<br>CAR";

      document.getElementById(
        "mission"
      ).textContent=
        "MISSION: Explore the city";
    }
  }
);


/* =========================
   ATTACK
========================= */

document
.getElementById("attack")
.addEventListener(
  "click",
  ()=>{

    document.getElementById(
      "mission"
    ).textContent=
      "👊 Attack activated!";
  }
);


/* =========================
   CAMERA
========================= */

const clock=
new THREE.Clock();

const cameraPosition=
new THREE.Vector3();

const cameraLook=
new THREE.Vector3();

function animate(){

  requestAnimationFrame(
    animate
  );

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );


  updateMovement(dt);


  const target=
    driving ?
    car :
    player;


  /*
    Camera rotates ONLY
    from right-side swipe
  */

  const distance=17;

  const horizontal=
    Math.cos(cameraPitch)*
    distance;

  cameraPosition.set(
    target.position.x+
      Math.sin(cameraYaw)*
      horizontal,

    target.position.y+
      3+
      Math.sin(cameraPitch)*
      distance,

    target.position.z+
      Math.cos(cameraYaw)*
      horizontal
  );


  camera.position.lerp(
    cameraPosition,
    .12
  );


  cameraLook.set(
    target.position.x,
    target.position.y+1.3,
    target.position.z
  );


  camera.lookAt(
    cameraLook
  );


  renderer.render(
    scene,
    camera
  );
}

animate();


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

</script>

</body>
</html>
