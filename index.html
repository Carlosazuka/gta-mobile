<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GTA Mobile V2</title>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 user-select:none;
 -webkit-user-select:none;

}

html,body{

canvas{

}

#hud{

   MATERIAL
========================================================= */

function material(color){

 return new THREE.MeshStandardMaterial({
  color,
  roughness:.75,
  metalness:.05
 });
}


function box(
 w,h,d,
 color,
 x,y,z
){

 const m=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   w,h,d
  ),
  material(color)
 );

 m.position.set(
  x,y,z
 );

 m.castShadow=true;
 m.receiveShadow=true;

 scene.add(m);

 return m;
}

 for(

/* =========================================================
   CAR
========================================================= */

function createCar(
 color,x,z
){

 const car=
 new THREE.Group();


 const body=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   4.5,1.25,7.2
  ),
  material(color)
 );

 body.position.y=1;

 car.add(body);


 const cabin=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   3.2,1.2,3.3
  ),
  material(0x20282e)
 );

 cabin.position.set(
  0,1.9,-.2
 );

 car.add(cabin);


 /* headlights */

 for(
  const x of[-1.4,1.4]
 ){

  box(
   .55,.3,.12,
   0xfff1bb,
   x,.95,-3.65
  );
 }


 /* wheels */

 for(
  const x of[-1.9,1.9]
 ){

  for(
   const z of[-2.3,2.3]
  ){

   const wheel=
   new THREE.Mesh(
    new THREE.CylinderGeometry(
     .68,.68,.5,16
    ),
    material(0x101010)
   );

   wheel.rotation.z=
    Math.PI/2;

   wheel.position.set(
    x,.55,z
   );

 car.position.set(
  x,0,z
 );

 scene.add(car);

 return car;
}

/* =========================================================
   JOYSTICK
========================================================= */

const joy=
document.getElementById(
 "joystick"
);

const stick=
document.getElementById(
 "stick"
);

let joyX=0;
let joyY=0;
let joyId=null;

const maxJoy=45;


function moveJoy(
 x,y
){

 const r=
  joy.getBoundingClientRect();

 let dx=
  x-(r.left+r.width/2);

 let dy=
  y-(r.top+r.height/2);

 const len=
  Math.hypot(dx,dy);

 if(len>maxJoy){

  dx=
   dx/len*maxJoy;

  dy=
   dy/len*maxJoy;
 }

 joyX=dx/maxJoy;
 joyY=dy/maxJoy;

 stick.style.transform=
  `translate(${dx}px,${dy}px)`;
}


joy.addEventListener(
 "touchstart",
 e=>{

  const t=
   e.changedTouches[0];

  joyId=t.identifier;

  moveJoy(
   t.clientX,
   t.clientY
  );
 },
 {passive:false}
);


joy.addEventListener(
 "touchmove",
 e=>{

  e.preventDefault();

  for(
   const t of e.changedTouches
  ){

   if(
    t.identifier===
    joyId
   ){

    moveJoy(
     t.clientX,
     t.clientY
    );
   }
  }
 },
 {passive:false}
);


joy.addEventListener(
 "touchend",
 e=>{

  joyX=0;
  joyY=0;
  joyId=null;

  stick.style.transform=
   "translate(0,0)";
 }
);


/* =========================================================
   CAMERA SWIPE
========================================================= */

const look=
document.getElementById(
 "look"
);

let lookId=null;

let lastX=0;
let lastY=0;

let yaw=0;
let pitch=.38;


look.addEventListener(
 "touchstart",
 e=>{

  const t=
   e.changedTouches[0];

  lookId=t.identifier;

  lastX=t.clientX;
  lastY=t.clientY;
 },
 {passive:false}
);


look.addEventListener(
 "touchmove",
 e=>{

  e.preventDefault();

  for(
   const t of e.changedTouches
  ){

   if(
    t.identifier!==
    lookId
   ) continue;

   const dx=
    t.clientX-lastX;

   const dy=
    t.clientY-lastY;

   lastX=t.clientX;
   lastY=t.clientY;

   yaw-=dx*.012;

   pitch-=dy*.008;

   pitch=
    THREE.MathUtils.clamp(
     pitch,
     -.2,
     1
    );
  }
 },
 {passive:false}
);


look.addEventListener(
 "touchend",
 ()=>{
  lookId=null;
 }
);


/* =========================================================
   MOVEMENT
========================================================= */

let driving=false;

const forward=
new THREE.Vector3();

const right=
new THREE.Vector3();

const movement=
new THREE.Vector3();


function updateMovement(dt){

 if(
  Math.abs(joyX)<.03 &&
  Math.abs(joyY)<.03
 ) return;


 forward.set(
  -Math.sin(yaw),
  0,
  -Math.cos(yaw)
 );

 right.set(
  Math.cos(yaw),
  0,
  -Math.sin(yaw)
 );


 movement.set(
  0,0,0
 );


 movement.addScaledVector(
  forward,
  -joyY
 );

 movement.addScaledVector(
  right,
  joyX
 );


 if(
  movement.lengthSq()<.001
 ) return;

 movement.normalize();


 const speed=
  driving?
  21:
  7;


 if(driving){

  playerCar.position.addScaledVector(
   movement,
   speed*dt
  );

  player.position.copy(
   playerCar.position
  );

  playerCar.rotation.y=
   Math.atan2(
    movement.x,
    movement.z
   );

 }else{

  player.position.addScaledVector(
   movement,
   speed*dt
  );

  player.rotation.y=
   Math.atan2(
    movement.x,
    movement.z
   );
 }
}


/* =========================================================
   CAR BUTTON
========================================================= */

document
.getElementById("car")
.addEventListener(
 "click",
 ()=>{

  const distance=
   player.position.distanceTo(
    playerCar.position
   );


  if(
   !driving &&
   distance<8
  ){

   driving=true;

   player.visible=false;

   document.getElementById(
    "car"
   ).innerHTML=
    "🚶<br>EXIT";

   document.getElementById(
    "mission"
   ).textContent=

  }else if(driving){

   driving=false;

   player.visible=true;

   player.position.copy(
    playerCar.position
   );

   player.position.x+=3;

   document.getElementById(
    "car"
   ).innerHTML=
    "🚗<br>CAR";
  }
 }
);

/* =========================================================
   TRAFFIC AI
========================================================= */

function updateTraffic(dt){

 for(
  const t of traffic
 ){

  if(t.horizontal){

   t.car.position.x+=
    t.speed*
    t.dir*
    dt;

   if(
    t.car.position.x>190
   )
    t.car.position.x=-190;

   if(
    t.car.position.x<-190
   )
    t.car.position.x=190;

   t.car.rotation.y=
    t.dir>0?
    Math.PI/2:
    -Math.PI/2;

  }else{

   t.car.position.z+=
    t.speed*
    t.dir*
    dt;

   if(
    t.car.position.z>190
   )
    t.car.position.z=-190;

   if(
    t.car.position.z<-190
   )
    t.car.position.z=190;

   t.car.rotation.y=
    t.dir>0?
    0:
    Math.PI;
  }
 }
}


/* =========================================================
   NPC AI
========================================================= */

function updateNPCs(dt){

 for(
  const n of npcs
 ){

  n.angle+=
   (Math.random()-.5)*
   dt;

  n.object.position.x+=
   Math.sin(n.angle)*
   n.speed*
   dt;

  n.object.position.z+=
   Math.cos(n.angle)*
   n.speed*
   dt;

  if(
   n.object.position.x>165
  )
   n.object.position.x=-165;

  if(
   n.object.position.x<-165
  )
   n.object.position.x=165;

  if(
   n.object.position.z>165
  )
   n.object.position.z=-165;

  if(
   n.object.position.z<-165
  )
   n.object.position.z=165;
 }
}


/* =========================================================
   CAMERA
========================================================= */

const camPos=
new THREE.Vector3();

const target=
new THREE.Vector3();


function updateCamera(){

 const focus=
  driving?
  playerCar:
  player;

 const distance=17;

 const horizontal=
  Math.cos(pitch)*
  distance;


 camPos.set(

  focus.position.x+
   Math.sin(yaw)*
   horizontal,

  focus.position.y+
   4+
   Math.sin(pitch)*
   distance,

  focus.position.z+
   Math.cos(yaw)*
   horizontal
 );


 camera.position.lerp(
  camPos,
  .12
 );


 target.set(
  focus.position.x,
  focus.position.y+1.3,
  focus.position.z
 );


 camera.lookAt(target);
}


/* =========================================================
   GAME LOOP
========================================================= */

const clock=
new THREE.Clock();


function animate(){

 requestAnimationFrame(
  animate
 );

 const dt=
  Math.min(
   clock.getDelta(),
   .05
  );

 updateMovement(dt);
 updateTraffic(dt);
 updateNPCs(dt);
 updateCamera();

 renderer.render(
  scene,
  camera
 );
}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);

</script>

</body>
</html>
