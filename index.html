function mat(color){

 return new THREE.MeshStandardMaterial({
  color:color,
  roughness:.78,
  metalness:.05
 });
}


function cube(
 w,h,d,
 color,
 x,y,z,
 material=null
){

 const mesh=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   w,h,d
  ),
  material || mat(color)
 );

 mesh.position.set(
  x,y,z
 );

 mesh.castShadow=true;
 mesh.receiveShadow=true;

 scene.add(mesh);

 return mesh;
}

/* =====================================================
   JOYSTICK
===================================================== */

const joystick=
document.getElementById(
 "joystick"
);

const stick=
document.getElementById(
 "stick"
);

let joyX=0;
let joyY=0;
let joyId=null;

const JR=44;


function setJoystick(x,y){

 const r=
  joystick.getBoundingClientRect();

 let dx=
  x-
  (r.left+r.width/2);

 let dy=
  y-
  (r.top+r.height/2);

 const len=
  Math.hypot(dx,dy);

 if(len>JR){

  dx=
   dx/len*JR;

  dy=
   dy/len*JR;
 }

 joyX=dx/JR;
 joyY=dy/JR;

 stick.style.transform=
  `translate(${dx}px,${dy}px)`;
}


joystick.addEventListener(
 "touchstart",
 e=>{

  const t=
   e.changedTouches[0];

  joyId=
   t.identifier;

  setJoystick(
   t.clientX,
   t.clientY
  );

 },
 {passive:false}
);


joystick.addEventListener(
 "touchmove",
 e=>{

  e.preventDefault();

  for(
   const t of e.changedTouches
  ){

   if(
    t.identifier===
    joyId
   ){

    setJoystick(
     t.clientX,
     t.clientY
    );
   }
  }

 },
 {passive:false}
);


joystick.addEventListener(
 "touchend",
 e=>{

  for(
   const t of e.changedTouches
  ){

   if(
    t.identifier===
    joyId
   ){

    joyId=null;

    joyX=0;
    joyY=0;

    stick.style.transform=
     "translate(0,0)";
   }
  }

 }
);


/* =====================================================
   CAMERA SWIPE
===================================================== */

const look=
document.getElementById(
 "look"
);

let lookId=null;

let lastX=0;
let lastY=0;

let yaw=0;
let pitch=.4;


look.addEventListener(
 "touchstart",
 e=>{

  const t=
   e.changedTouches[0];

  lookId=
   t.identifier;

  lastX=
   t.clientX;

  lastY=
   t.clientY;

 },
 {passive:false}
);


look.addEventListener(
 "touchmove",
 e=>{

  e.preventDefault();

  for(
   const t of e.changedTouches
  ){

   if(
    t.identifier!==
    lookId
   ) continue;

   const dx=
    t.clientX-lastX;

   const dy=
    t.clientY-lastY;

   lastX=t.clientX;
   lastY=t.clientY;

   yaw-=dx*.012;

   pitch-=dy*.008;

   pitch=
    THREE.MathUtils.clamp(
     pitch,
     -.15,
     1.05
    );
  }

 },
 {passive:false}
);


look.addEventListener(
 "touchend",
 e=>{

  for(
   const t of e.changedTouches
  ){

   if(
    t.identifier===
    lookId
   ){

    lookId=null;
   }
  }

 }
);


/* =====================================================
   MOVEMENT
===================================================== */

let driving=false;

const forward=
new THREE.Vector3();

const right=
new THREE.Vector3();

const move=
new THREE.Vector3();


function updateMovement(dt){

 if(
  Math.abs(joyX)<.04 &&
  Math.abs(joyY)<.04
 ) return;


 forward.set(
  -Math.sin(yaw),
  0,
  -Math.cos(yaw)
 );

 right.set(
  Math.cos(yaw),
  0,
  -Math.sin(yaw)
 );


 move.set(
  0,0,0
 );


 move.addScaledVector(
  forward,
  -joyY
 );

 move.addScaledVector(
  right,
  joyX
 );


 if(
  move.lengthSq()<.001
 ) return;

 move.normalize();


 const speed=
  driving?
  20:
  7;


 if(driving){

  playerCar.position.addScaledVector(
   move,
   speed*dt
  );

  player.position.copy(
   playerCar.position
  );

  playerCar.rotation.y=
   Math.atan2(
    move.x,
    move.z
   );

 }else{

  player.position.addScaledVector(
   move,
   speed*dt
  );

  player.rotation.y=
   Math.atan2(
    move.x,
    move.z
   );
 }
}

    playerCar.position
   );

   player.position.x+=3;

   carBtn.innerHTML=
    "🚗<br>CAR";
  }

 }
);


/* =====================================================
   TRAFFIC UPDATE
===================================================== */

function updateTraffic(dt){

 for(
  const t of traffic
 ){

  if(t.horizontal){

   t.car.position.x+=
    t.speed*
    t.direction*
    dt;

   if(t.car.position.x>170)
    t.car.position.x=-170;

   if(t.car.position.x<-170)
    t.car.position.x=170;

   t.car.rotation.y=
    t.direction>0?
    Math.PI/2:
    -Math.PI/2;

  }else{

   t.car.position.z+=
    t.speed*
    t.direction*
    dt;

   if(t.car.position.z>170)
    t.car.position.z=-170;

   if(t.car.position.z<-170)
    t.car.position.z=170;

   t.car.rotation.y=
    t.direction>0?
    0:
    Math.PI;
  }
 }
}


/* =====================================================
   NPC UPDATE
===================================================== */

function updateNPCs(dt){

 for(
  const n of npcs
 ){

  n.angle+=
   (Math.random()-.5)*
   dt;

  n.object.position.x+=
   Math.sin(n.angle)*
   n.speed*
   dt;

  n.object.position.z+=
   Math.cos(n.angle)*
   n.speed*
   dt;

  if(
   n.object.position.x>150
  )
   n.object.position.x=-150;

  if(
   n.object.position.x<-150
  )
   n.object.position.x=150;

  if(
   n.object.position.z>150
  )
   n.object.position.z=-150;

  if(
   n.object.position.z<-150
  )
   n.object.position.z=150;
 }
}


/* =====================================================
   ATTACK / WANTED
===================================================== */

let wanted=0;

document
.getElementById("attack")
.addEventListener(
 "click",
 ()=>{

  wanted=
   Math.min(
    5,
    wanted+1
   );

  document.getElementById(
   "top"
  ).innerHTML=
   `❤️ 100 &nbsp; 💰 $250 &nbsp; ⭐ ${wanted}`;

  document.getElementById(
   "mission"
  ).textContent=
   "⚠️ WANTED LEVEL INCREASED";
 }
);


/* =====================================================
   CAMERA
===================================================== */

const cameraPosition=
new THREE.Vector3();

const cameraTarget=
new THREE.Vector3();


function updateCamera(){

 const target=
  driving?
  playerCar:
  player;


 const distance=16;

 const horizontal=
  Math.cos(pitch)*
  distance;


 cameraPosition.set(

  target.position.x+
   Math.sin(yaw)*
   horizontal,

  target.position.y+
   4+
   Math.sin(pitch)*
   distance,

  target.position.z+
   Math.cos(yaw)*
   horizontal
 );


 camera.position.lerp(
  cameraPosition,
  .12
 );


 cameraTarget.set(
  target.position.x,
  target.position.y+1.3,
  target.position.z
 );


 camera.lookAt(
  cameraTarget
 );
}


/* =====================================================
   LOOP
===================================================== */

const clock=
new THREE.Clock();


function loop(){

 requestAnimationFrame(
  loop
 );

 const dt=
  Math.min(
   clock.getDelta(),
   .05
  );

 updateMovement(dt);
 updateTraffic(dt);
 updateNPCs(dt);
 updateCamera();

 renderer.render(
  scene,
  camera
 );
}


loop();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/
   innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);

</script>
